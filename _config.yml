# Jekyll configuration for academic profile

# Site settings
url: "https://Jingxin-Liu.github.io"
title: "Jingxin Liu"
description: "Associate Professor | AI & Computational Pathology"
author: "Jingxin Liu"
email: "jingxin.liu@xjtlu.edu.cn"

# Build settings
markdown: kramdown
highlighter: rouge
pagination:
  enabled: true
  per_page: 10

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag

# Collections for different sections
collections:
  publications:
    output: true
    permalink: /publications/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "default"

# SEO settings
social:
  name: Jingxin Liu
  links:
    - https://github.com/Jingxin-Liu
    - https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID
    - https://orcid.org/0000-0001-XXXX-XXXX

# Navigation
header_pages:
  - about.md
  - research.md
  - blog.md

# VIBE Lab
vibe_lab:
  name: "VIBE Lab"
  url: "https://vibe-lab.example.com"
